
name: smart_attend
description: "SmartAttend - GPS-Based Smart Attendance Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  geolocator: ^14.1.2
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generate SmartAttend app icons for Android and iOS.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# SmartAttend launcher icon configuration.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/smartattend_app_icon_1024.png"
  remove_alpha_ios: true
